name: Lint and Test

on:
  pull_request:
    branches: [main]
  # Catches semantic merge conflicts that individually-green PRs can
  # introduce once merged (e.g. upstream #104 and #106 each passed CI
  # alone but together broke main's build, undetected until #108).
  push:
    branches: [main]

jobs:
  rust-test:
    uses: ./.github/workflows/wc-rust-test.yaml
