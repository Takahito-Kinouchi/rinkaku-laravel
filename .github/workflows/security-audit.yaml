# Dependency advisory check, kept separate from lint-and-test so it can also
# run on a schedule: a new RustSec advisory lands against code that hasn't
# changed, so a PR-only check would never see it.
#
# Runs `make audit` (i.e. `cargo audit`) rather than an advisory-checking
# action, so CI and a local run execute the exact same command — the same
# rule the test/lint workflow follows.
name: Security Audit

on:
  # Deliberately unfiltered by path. Restricting this to manifest changes
  # would be cheaper, but a path-filtered workflow simply does not report
  # a check run on a PR that misses the filter — and a required status
  # check that never reports blocks the PR forever. Since this job is the
  # one that would sensibly be required, it has to run on every PR. With
  # the cache warm it takes about 30 seconds.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays 00:00 UTC — catches advisories published against a lockfile
    # nothing has touched.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rust-audit

      # `--locked` so cargo-audit itself is built from its published
      # lockfile rather than whatever resolves today.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Fails on advisories classed as vulnerabilities; `unmaintained` /
      # `unsound` advisories are reported as warnings without failing the
      # job, which is deliberate — those need a judgement call about the
      # replacement, not an immediately red pipeline.
      - name: Run audit
        run: make audit
