[package]
# ADR 0083: renamed from `rinkaku` so the installed command
# (`rinkaku-laravel`) can never collide with, or be confused for, an
# `hiro-o918/rinkaku` install of the same binary name on the same
# machine. No `[[bin]]` table: the bin target's name defaults to the
# package name, which is exactly `rinkaku-laravel` now — an explicit
# `[[bin]] name = "rinkaku"` alias would recreate the collision this
# rename exists to remove.
name = "rinkaku-laravel"
# See rinkaku-core/Cargo.toml for why this is a literal version instead
# of `version.workspace = true`.
version = "0.6.22"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Condense PR diffs into signatures and their dependencies for LLM-friendly review"
documentation = "https://docs.rs/rinkaku"
readme = "../README.md"
keywords = ["diff", "tree-sitter", "code-review", "llm"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[dependencies]
# ADR 0078: parallel working-tree reads in build_resolver.
rayon = { workspace = true }
rinkaku-core = { path = "../rinkaku-core", version = "0.6.21" }
rinkaku-tui = { path = "../rinkaku-tui", version = "0.6.21" }
clap = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indicatif = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
